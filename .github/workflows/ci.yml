name: CPU checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
      - run: python examples/prompt_smoke.py
      - run: python -m kapt_lab ensemble --predictions examples/model_a.csv examples/model_b.csv examples/model_c.csv --labels examples/labels.csv --weights 1 1 2 --threshold 0.5 --output output/ensemble.csv --report output/report.json
