[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kapt-reproducibility-lab"
version = "0.1.0"
description = "Small prompt-learning components and reliable evaluation exercises, curated from a KANO-based workspace."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<3", "scikit-learn>=1.4,<2"]

[project.optional-dependencies]
prompts = ["torch>=2.6,<3"]

[tool.setuptools.packages.find]
where = ["src"]
